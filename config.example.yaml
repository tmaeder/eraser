# Eraser Configuration Example
# Copy this file to ~/.eraser/config.yaml and fill in your details

profile:
  # Required: Your personal information for removal requests
  first_name: John
  last_name: Doe
  email: john.doe@example.com

  # Optional: Additional info helps brokers locate your records
  address: "123 Main Street"
  city: "San Francisco"
  state: "CA"
  zip_code: "94102"
  country: "USA"
  phone: "+1-555-123-4567"
  date_of_birth: "1990-01-15"  # Format: YYYY-MM-DD

# The one mail account used for sending requests (SMTP) and reading replies (IMAP).
account:
  # icloud (smtp.mail.me.com:587 + imap.mail.me.com:993), gmail, outlook or custom
  provider: icloud
  email: john.doe@icloud.com  # primary iCloud Mail address (login; aliases are rejected)
  # send_as: john@me.com      # optional alias used as From (must be one of your aliases)
  password: your-app-password  # app-specific password, never your account password!
  # Only for provider: custom
  # smtp_host: mail.example.com
  # smtp_port: 587            # 587 = STARTTLS, otherwise implicit TLS
  # imap_host: mail.example.com
  # imap_port: 993

email:
  # Open tracking (own Message-ID, read-receipt headers, pixel). Experimental: may cause
  # iCloud to reject mail. Off = plain-text mail as before.
  tracking: false

# inbox:
#   enabled: true            # read replies over IMAP with the account above
#   folder: INBOX
#   auto_archive: false
#   archive_folder: Eraser
#   scan_folders: []         # company scanner; empty = INBOX + archive + common folders

options:
  # Template to use: "auto", "gdpr", "ccpa", "fadp" or "generic"
  template: generic

  # Delay between emails in milliseconds (avoid spam filters)
  rate_limit_ms: 2000

  # Only send to brokers in these regions (optional)
  # regions:
  #   - us
  #   - global

  # Skip these brokers (optional)
  # excluded_brokers:
  #   - spokeo
  #   - whitepages
